# Priora — implantação local (Neo4j + API).
# Nenhum dado sai da máquina/rede: o banco roda em contêiner e as imagens do
# quadro ficam em volume (Supabase só é usado se SUPABASE_* estiver definido).
#
#   cp .env.example .env     # preencha SECRET_KEY, MAIL_*, SUPPORT_EMAIL
#   docker compose up -d --build
#
# API: http://localhost:8000   |   Neo4j Browser: http://localhost:7474
services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_LOCAL_PASSWORD:-priora-local-pass}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    env_file: ${API_ENV_FILE:-.env}
    environment:
      # Sobrescrevem qualquer NEO4J_* do .env (ex.: Aura) para usar o banco local.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_LOCAL_PASSWORD:-priora-local-pass}
      NEO4J_DATABASE: neo4j
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  neo4j_data:
  uploads:
