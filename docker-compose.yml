# Priora — implantação local (Neo4j + API).
# Nenhum dado sai da máquina/rede: o banco roda em contêiner e as imagens do
# quadro ficam em volume (Supabase só é usado se SUPABASE_* estiver definido).
#
#   cp .env.example .env     # preencha SECRET_KEY, MAIL_*, SUPPORT_EMAIL
#   docker compose up -d --build                  # Neo4j + API
#   docker compose --profile web up -d --build    # + front (pasta ../priora_client)
#
# API: http://localhost:8000   |   Neo4j Browser: http://localhost:7474
# Front (perfil "web"): http://localhost:5173
#
# Em outra máquina da rede, defina no .env o endereço visto pelo navegador:
#   PUBLIC_API_URL=http://IP:8000   CORS_ORIGINS=http://IP:5173   FRONTEND_URL=http://IP:5173
services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_LOCAL_PASSWORD:-priora-local-pass}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    env_file: ${API_ENV_FILE:-.env}
    environment:
      # Sobrescrevem qualquer NEO4J_* do .env (ex.: Aura) para usar o banco local.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_LOCAL_PASSWORD:-priora-local-pass}
      NEO4J_DATABASE: neo4j
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UPLOAD_DIR: /app/uploads
      # Sem servidor de e-mail na rede local, a conta nasce já confirmada. Para exigir
      # a confirmação, configure MAIL_* no .env e defina REQUIRE_EMAIL_VERIFICATION=true.
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  web:
    # Front do Priora. Exige o repositório priora_client ao lado deste.
    profiles: ["web"]
    build:
      context: ../priora_client
      args:
        # embutido no build: endereço da API como o NAVEGADOR enxerga
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  neo4j_data:
  uploads:
